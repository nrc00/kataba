[package]
name = "kataba-lsp"
version = "0.1.0"
edition = "2021"
description = "Language Server Protocol implementation for Kataba editor"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kataba-core = { path = "../kataba-core" }
tower-lsp = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
proptest = "1"
criterion = "0.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }