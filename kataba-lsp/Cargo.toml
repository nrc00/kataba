[package]
name = "kataba-lsp"
version = "0.1.0"
edition = "2021"
description = "Language Server Protocol implementation for Kataba editor"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kataba-core = { path = "../kataba-core" }
lsp-types = "0.95"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
bytes = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = { version = "6", features = ["default"] }
tracing = "0.1"

[dev-dependencies]
proptest = "1"
criterion = "0.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }