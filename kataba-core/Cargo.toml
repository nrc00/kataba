[package]
name = "kataba-core"
version = "0.1.0"
edition = "2021"
description = "A small, property-tested editor core"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ropey = "1.6"
sha2 = "0.10"
smartstring = "1"
unicode-segmentation = "1"
unicode-width = "0.1"
unicode-normalization = "0.1"
smallvec = "1"
thiserror = "1"
bitflags = "2"

[dev-dependencies]
proptest = "1"
criterion = "0.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }